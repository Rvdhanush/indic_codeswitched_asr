# Seeds the oversampling RNG and the HF Trainer, so a rerun with the same
# config reproduces the same training-set composition and shuffle order.
seed: 42

model:
  base_model: "openai/whisper-small"
  language: "tamil"
  task: "transcribe"

lora:
  r: 32
  lora_alpha: 64
  target_modules:
    - "q_proj"
    - "v_proj"
  lora_dropout: 0.05
  bias: "none"

training:
  output_dir: "./checkpoints"
  num_train_epochs: 5
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 1.0e-3
  warmup_steps: 50
  evaluation_strategy: "steps"
  eval_steps: 50
  save_steps: 50
  logging_steps: 25
  fp16: true
  dataloader_num_workers: 0
  load_best_model_at_end: true
  metric_for_best_model: "wer"
  greater_is_better: false
  optim: "adamw_8bit"

data:
  # Splits are read from the frozen corpus (data/corpus/splits/*.json),
  # not rebuilt. Change the corpus with: python -m data.corpus freeze
  train_split: "train"
  val_split: "validation"
  # Corpus build size. Consumed by `data.corpus freeze --size`, recorded
  # in the manifest provenance. Training reads whatever was frozen.
  max_samples: 1500
  max_audio_length_seconds: 30
  oversample_code_switched: 3
  oversample_switch_boundary: 2
  undersample_monolingual: 0.5
